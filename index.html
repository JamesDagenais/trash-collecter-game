<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#231a2e" />
    <title>Berlin Trash Clicker</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/character.css" />
    <link rel="stylesheet" href="css/shop.css" />
    <link rel="stylesheet" href="css/effects.css" />
  </head>
  <body>
    <main class="game" id="game">
      <h1 class="sr-only">Berlin Trash Clicker</h1>

      <!-- HUD: money, the three rates, where you are, sound + reset -->
      <header class="hud" aria-label="Stats">
        <div class="hud-row">
          <button class="hud-zone" id="zoneButton" type="button" aria-label="Change zone">
            <span class="hud-zone-pin" aria-hidden="true"></span>
            <span class="hud-zone-name" id="zoneName"></span>
            <span class="hud-zone-caret" aria-hidden="true"></span>
          </button>
          <span class="hud-buttons">
            <button class="icon-btn sound" id="soundToggle" type="button">Sound</button>
            <button class="icon-btn reset" id="resetButton" type="button" aria-label="Reset progress" title="Reset progress">Reset</button>
          </span>
        </div>
        <div class="hud-row hud-main">
          <div class="money">
            <span class="sr-only">Money</span>
            <span class="money-value" id="money">€0</span>
          </div>
          <dl class="rates">
            <div class="rate">
              <dt>Trash</dt>
              <dd id="trash">0</dd>
            </div>
            <div class="rate">
              <dt>Per tap</dt>
              <dd id="perTap">1</dd>
            </div>
            <div class="rate">
              <dt>Per sec</dt>
              <dd id="perSecond">0</dd>
            </div>
          </dl>
        </div>
      </header>

      <!-- The street: the whole picture is the tap target -->
      <section class="stage" id="stage" aria-label="Street">
        <button class="tap" id="tapButton" type="button" aria-label="Pick up trash" aria-describedby="tool">
          <canvas class="scene" id="scene" aria-hidden="true"></canvas>
        </button>
        <div class="floaters" id="floaters" aria-hidden="true"></div>
        <p class="tool-tag"><span class="tool-tag-icon" id="toolIcon" aria-hidden="true"></span><span id="tool">Trash Pick</span></p>
        <p class="tap-hint" id="tapHint" aria-hidden="true">tap him!</p>
      </section>

      <!-- Pull-up sheet: equipment + zones. Collapsed it is a quick-buy shelf. -->
      <section class="sheet" id="sheet" aria-label="Shop">
        <div class="sheet-head" id="sheetHead">
          <span class="sheet-grip" aria-hidden="true"></span>
          <div class="sheet-tabs" role="tablist" aria-label="Shop sections">
            <button class="sheet-tab" id="tabShop" type="button" role="tab" aria-selected="true" aria-controls="paneShop">
              <span class="sheet-tab-icon gear" aria-hidden="true"></span>Gear
            </button>
            <button class="sheet-tab" id="tabZones" type="button" role="tab" aria-selected="false" aria-controls="paneZones" tabindex="-1">
              <span class="sheet-tab-icon map" aria-hidden="true"></span>Zones
            </button>
            <button class="sheet-tab" id="tabAwards" type="button" role="tab" aria-selected="false" aria-controls="paneAwards" tabindex="-1">
              <span class="sheet-tab-icon trophy" aria-hidden="true"></span>Awards
            </button>
          </div>
          <button class="sheet-toggle" id="sheetToggle" type="button" aria-expanded="false" aria-controls="sheetBody" aria-label="Open shop">
            <span class="sheet-toggle-icon" aria-hidden="true"></span>
          </button>
        </div>
        <div class="sheet-body" id="sheetBody">
          <!-- Shop UI renders everything inside #shop and #zones -->
          <div class="pane" id="paneShop" role="tabpanel" aria-labelledby="tabShop">
            <div class="shop" id="shop"></div>
          </div>
          <div class="pane" id="paneZones" role="tabpanel" aria-labelledby="tabZones" hidden>
            <div class="zones" id="zones"></div>
          </div>
          <!-- Awards (achievements) render inside #achievements -->
          <div class="pane" id="paneAwards" role="tabpanel" aria-labelledby="tabAwards" hidden>
            <div id="achievements"></div>
          </div>
          <p class="save-status" id="saveStatus">Progress saves automatically</p>
        </div>
      </section>
      <div class="sheet-scrim" id="sheetScrim" aria-hidden="true"></div>
    </main>

    <!-- Load order: data → logic → save → shared helpers → art → UI modules → main -->
    <script src="js/upgrades.js"></script>
    <script src="js/zones.js"></script>
    <script src="js/state.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/save.js"></script>
    <script src="js/format.js"></script>
    <script src="js/sprites.js"></script>
    <script src="js/character.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/awards.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
